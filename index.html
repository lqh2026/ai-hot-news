<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI HOT · 实时AI热点资讯</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f11;
    --bg2: #17171a;
    --bg3: #1e1e22;
    --bg4: #26262c;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #f0f0f0;
    --text2: #a0a0aa;
    --text3: #606068;
    --green: #1ecb7b;
    --green-dim: rgba(30,203,123,0.12);
    --green-dark: #0f6e45;
    --accent: #7c6af7;
    --accent-dim: rgba(124,106,247,0.12);
    --sidebar-w: 210px;
    --radius: 10px;
    --radius-sm: 6px;
  }

  html, body { height: 100%; font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

  /* ── Layout ── */
  #app { display: flex; height: 100vh; overflow: hidden; }

  /* ── Sidebar ── */
  #sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    transition: transform 0.25s;
  }

  .logo {
    padding: 20px 18px 16px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--text);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-badge {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: glow 2s ease-in-out infinite;
  }
  @keyframes glow { 0%,100%{opacity:1;box-shadow:0 0 8px var(--green)} 50%{opacity:.4;box-shadow:0 0 2px var(--green)} }

  .section-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--text3);
    padding: 14px 18px 6px;
    text-transform: uppercase;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 18px;
    font-size: 13px;
    color: var(--text2);
    cursor: pointer;
    border-radius: 0;
    transition: all 0.15s;
    border-left: 2px solid transparent;
    user-select: none;
  }
  .nav-item:hover { background: var(--bg3); color: var(--text); }
  .nav-item.active { background: var(--bg3); color: var(--green); border-left-color: var(--green); font-weight: 500; }
  .nav-icon { font-size: 15px; width: 18px; text-align: center; opacity: 0.8; }

  .sidebar-divider { height: 1px; background: var(--border); margin: 6px 0; }
  .sidebar-footer { margin-top: auto; padding: 14px 18px; border-top: 1px solid var(--border); }
  .sidebar-footer .nav-item { padding: 7px 0; font-size: 12px; color: var(--text3); border: none; }

  /* ── Main ── */
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

  #topbar {
    padding: 14px 22px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .page-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .live-pill {
    display: flex; align-items: center; gap: 5px;
    font-size: 11px; color: var(--green);
    background: var(--green-dim);
    padding: 3px 10px; border-radius: 20px;
  }
  .live-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); animation: glow 2s infinite; }

  .topbar-right { display: flex; align-items: center; gap: 10px; }
  #update-time { font-size: 11px; color: var(--text3); white-space: nowrap; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text2);
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    padding: 6px 14px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .btn:hover { background: var(--bg4); color: var(--text); border-color: var(--border2); }
  .btn:active { transform: scale(0.97); }
  .btn.spinning .spin-icon { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Filter bar ── */
  #filter-bar {
    padding: 10px 22px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .tag-btn {
    font-size: 12px;
    padding: 4px 14px;
    border-radius: 20px;
    border: 1px solid var(--border2);
    color: var(--text2);
    background: transparent;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .tag-btn:hover { border-color: var(--green); color: var(--green); }
  .tag-btn.active { background: var(--green-dim); border-color: var(--green); color: var(--green); font-weight: 500; }

  /* ── Feed ── */
  #feed { flex: 1; overflow-y: auto; padding: 20px 22px; }
  #feed::-webkit-scrollbar { width: 4px; }
  #feed::-webkit-scrollbar-track { background: transparent; }
  #feed::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .date-label { font-size: 11px; color: var(--text3); margin-bottom: 14px; letter-spacing: 0.04em; }

  /* ── Timeline item ── */
  .tl-item { display: flex; gap: 14px; margin-bottom: 16px; }

  .tl-left {
    display: flex; flex-direction: column; align-items: center;
    min-width: 46px; flex-shrink: 0;
  }
  .tl-time { font-size: 11px; color: var(--text3); white-space: nowrap; font-variant-numeric: tabular-nums; margin-bottom: 7px; }
  .tl-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); flex-shrink: 0; }
  .tl-line { flex: 1; width: 1px; background: var(--border); margin-top: 5px; }

  .tl-card {
    flex: 1;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    min-width: 0;
  }
  .tl-card:hover { border-color: var(--border2); background: var(--bg3); }

  .card-source { font-size: 11px; color: var(--text3); margin-bottom: 6px; }
  .card-title { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.4; margin-bottom: 7px; }
  .card-desc {
    font-size: 12px; color: var(--text2); line-height: 1.6; margin-bottom: 10px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .card-tag { font-size: 11px; padding: 2px 9px; border-radius: 20px; background: var(--bg4); color: var(--text2); border: 1px solid var(--border); }

  .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .card-score {
    min-width: 30px; height: 28px; border-radius: var(--radius-sm);
    background: var(--bg4); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; color: var(--text2);
    flex-shrink: 0;
  }
  .card-score.high { color: var(--green); background: var(--green-dim); border-color: var(--green-dark); }
  .card-reason {
    font-size: 11px; color: var(--green);
    background: var(--green-dim);
    padding: 4px 12px; border-radius: 20px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 320px;
  }

  /* ── Error banner ── */
  .err-banner {
    background: rgba(232,180,90,0.08);
    border: 1px solid rgba(232,180,90,0.26);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    margin-bottom: 14px;
    font-size: 12px;
    color: #e8b45a;
    line-height: 1.65;
  }
  .err-banner .err-title { font-weight: 600; margin-bottom: 4px; }
  .err-banner .err-hint { color: var(--text3); font-size: 11px; }

  /* ── Loading / empty ── */
  .state-box { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 300px; gap: 14px; }
  .spinner { width: 24px; height: 24px; border: 2px solid var(--border2); border-top-color: var(--green); border-radius: 50%; animation: spin 0.8s linear infinite; }
  .state-text { font-size: 13px; color: var(--text3); }
  .state-sub { font-size: 12px; color: var(--text3); margin-top: -6px; }

  /* ── Responsive ── */
  @media (max-width: 680px) {
    #sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 50; transform: translateX(-100%); }
    #sidebar.open { transform: translateX(0); }
    .menu-btn { display: flex !important; }
  }
  .menu-btn { display: none; background: none; border: none; color: var(--text2); font-size: 20px; cursor: pointer; padding: 4px; }
</style>
</head>
<body>

<!-- App -->
<div id="app">
  <!-- Sidebar -->
  <div id="sidebar">
    <div class="logo">
      <div class="logo-badge"></div>
      AI HOT
    </div>

    <div class="section-label">发现</div>
    <div class="nav-item active" onclick="setNav(this,'精选','⚡')">
      <span class="nav-icon">⚡</span>精选
    </div>
    <div class="nav-item" onclick="setNav(this,'全部AI动态','≡')">
      <span class="nav-icon">≡</span>全部AI动态
    </div>
    <div class="nav-item" onclick="setNav(this,'低粉爆文','📄')">
      <span class="nav-icon">📄</span>低粉爆文
    </div>
    <div class="nav-item" onclick="setNav(this,'收藏','♡')">
      <span class="nav-icon">♡</span>收藏
    </div>
    <div class="nav-item" onclick="setNav(this,'信源','◎')">
      <span class="nav-icon">◎</span>信源
    </div>
    <div class="nav-item" onclick="setNav(this,'信源提报','+')">
      <span class="nav-icon">+</span>信源提报
    </div>

    <div class="sidebar-divider"></div>
    <div class="section-label">策略</div>
    <div class="nav-item" onclick="setNav(this,'精选策略','✓')">
      <span class="nav-icon">✓</span>精选策略
    </div>
    <div class="nav-item" onclick="setNav(this,'策略迭代','↻')">
      <span class="nav-icon">↻</span>策略迭代
    </div>

    <div class="sidebar-divider"></div>
    <div class="section-label">后台</div>
    <div class="nav-item" onclick="setNav(this,'系统','▣')">
      <span class="nav-icon">▣</span>系统
    </div>
    <div class="nav-item" onclick="setNav(this,'用户','👤')">
      <span class="nav-icon">👤</span>用户
    </div>

    <div class="sidebar-footer">
      <div class="nav-item" onclick="clearLocalCache()" style="padding:7px 0;font-size:12px;border:none;">
        <span class="nav-icon">🗑</span>清空本地缓存
      </div>
    </div>
  </div>

  <!-- Main -->
  <div id="main">
    <!-- Topbar -->
    <div id="topbar">
      <div class="topbar-left">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <div class="page-title" id="page-title">精选</div>
        <div class="live-pill"><div class="live-dot"></div>实时</div>
      </div>
      <div class="topbar-right">
        <span id="update-time"></span>
        <button class="btn" id="refresh-btn" onclick="loadNews()">
          <span class="spin-icon">↻</span> 刷新
        </button>
      </div>
    </div>

    <!-- Filter bar -->
    <div id="filter-bar">
      <button class="tag-btn active" onclick="setFilter(this,'全部')">全部</button>
      <button class="tag-btn" onclick="setFilter(this,'Agent')">Agent</button>
      <button class="tag-btn" onclick="setFilter(this,'产品更新')">产品更新</button>
      <button class="tag-btn" onclick="setFilter(this,'大模型')">大模型</button>
      <button class="tag-btn" onclick="setFilter(this,'具身智能')">具身智能</button>
      <button class="tag-btn" onclick="setFilter(this,'开源')">开源</button>
      <button class="tag-btn" onclick="setFilter(this,'研究')">研究</button>
      <button class="tag-btn" onclick="setFilter(this,'工具')">工具</button>
      <button class="tag-btn" onclick="setFilter(this,'搜索')">搜索</button>
    </div>

    <!-- Feed -->
    <div id="feed">
      <div class="state-box">
        <div class="spinner"></div>
        <div class="state-text">正在加载...</div>
      </div>
    </div>
  </div>
</div>

<script>
const LS_CACHE = 'ai_hot_cache_v2';
const MODULES_UNAVAILABLE = new Set(['收藏', '信源提报', '精选策略', '策略迭代', '系统', '用户']);
const TOP_SOURCE = /anthropic|openai|deepmind|google|meta|microsoft|nvidia|deepseek|qwen|通义|阿里|字节|moonshot|智谱/i;

const state = {
  items: [],
  updatedAt: null,
  model: '',
  cached: false,
  view: '精选',
  tag: '全部',
  loading: false,
  error: null,
};

// ── Init ──
window.addEventListener('DOMContentLoaded', () => {
  restoreCache();
  loadNews(false);
});

function restoreCache() {
  try {
    const raw = localStorage.getItem(LS_CACHE);
    if (!raw) return;
    const c = JSON.parse(raw);
    if (Array.isArray(c.items) && c.items.length) {
      state.items = c.items;
      state.updatedAt = c.updatedAt || null;
      state.model = c.model || '';
      state.cached = true;
      render();
    }
  } catch {
    /* 缓存损坏则忽略 */
  }
}

function persistCache(data) {
  try {
    localStorage.setItem(LS_CACHE, JSON.stringify({
      items: data.items,
      updatedAt: data.updatedAt,
      model: data.model,
    }));
  } catch {
    /* 超出配额时静默失败 */
  }
}

function clearLocalCache() {
  localStorage.removeItem(LS_CACHE);
  state.items = [];
  state.updatedAt = null;
  state.error = null;
  render();
  loadNews(true);
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// ── Nav ──
function setNav(el, name) {
  document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('page-title').textContent = name;
  state.view = name;
  document.getElementById('sidebar').classList.remove('open');
  render();
}

// ── Filter ──
function setFilter(el, tag) {
  document.querySelectorAll('.tag-btn').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  state.tag = tag;
  render();
}

// ── Load ──
async function loadNews(force) {
  if (state.loading) return;
  state.loading = true;
  state.error = null;

  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');

  if (!state.items.length) {
    document.getElementById('feed').innerHTML = `
      <div class="state-box">
        <div class="spinner"></div>
        <div class="state-text">正在同步最新 AI 资讯...</div>
        <div class="state-sub">服务端联网检索中，首次加载约需 20-40 秒</div>
      </div>`;
  }

  try {
    const res = await fetch('/api/news' + (force ? '?force=1' : ''), { cache: 'no-store' });
    const data = await res.json().catch(() => ({}));

    if (!res.ok && !Array.isArray(data.items)) {
      throw makeError(data.message || `接口返回 ${res.status}`, data.error);
    }
    if (!Array.isArray(data.items) || !data.items.length) {
      throw makeError(data.message || '未返回任何资讯', data.error || 'EMPTY');
    }

    state.items = data.items;
    state.updatedAt = data.updatedAt || null;
    state.model = data.model || '';
    state.cached = !!data.cached;
    // 服务端降级返回旧数据时，仍然提示错误但不遮断内容
    state.error = data.error ? { message: data.error, code: 'STALE' } : null;
    persistCache(data);
  } catch (err) {
    state.error = { message: err.message || '请求失败', code: err.code || 'NETWORK' };
  } finally {
    state.loading = false;
    btn.classList.remove('spinning');
    render();
  }
}

function makeError(message, code) {
  const e = new Error(message);
  e.code = code || 'UNKNOWN';
  return e;
}

const ERROR_HINTS = {
  UPSTREAM_FORBIDDEN: 'Anthropic 拒绝了服务端请求（403）。常见于部署区域受限或 Key 权限不足，请检查函数运行区域。',
  UPSTREAM_AUTH: '服务端 API Key 无效，请检查 ANTHROPIC_API_KEY 环境变量。',
  NO_API_KEY: '服务端尚未配置 ANTHROPIC_API_KEY 环境变量。',
  UPSTREAM_RATE_LIMIT: '上游触发限流，请稍后重试。',
  UPSTREAM_TIMEOUT: '上游响应超时，联网检索耗时过长。',
  UPSTREAM_UNREACHABLE: '服务端无法连接 Anthropic API，请检查网络出口。',
  MODEL_NOT_FOUND: '当前模型 ID 已下线，请更新 MODEL_CHAIN 配置。',
  PARSE_FAILED: '模型输出不是合法 JSON，本次抓取失败。',
  NO_RESULT: '本次检索未获得有效资讯。',
  EMPTY: '接口未返回任何数据。',
};

function errorHint(code) {
  return ERROR_HINTS[code] || '';
}

// ── Render ──
function render() {
  updateTopbar();
  const feed = document.getElementById('feed');

  if (MODULES_UNAVAILABLE.has(state.view)) {
    feed.innerHTML = `
      <div class="state-box">
        <div style="font-size:26px;opacity:.45">▤</div>
        <div class="state-text">「${escHtml(state.view)}」模块尚未接入数据源</div>
        <div class="state-sub">当前版本仅「资讯流」可用</div>
      </div>`;
    return;
  }

  if (!state.items.length) {
    if (state.loading) return;
    feed.innerHTML = errorBoxHtml();
    return;
  }

  if (state.view === '信源') {
    renderSources();
    return;
  }

  const list = applyView();
  if (!list.length) {
    feed.innerHTML = `${bannerHtml()}
      <div class="state-box"><div class="state-text">该分类暂无资讯</div></div>`;
    return;
  }

  renderList(list);
}

function applyView() {
  let list = state.items;

  if (state.view === '精选') {
    list = list.filter(n => n.score >= 80);
  } else if (state.view === '低粉爆文') {
    list = list.filter(n => n.score >= 70 && !TOP_SOURCE.test(n.source || ''));
  }

  if (state.tag !== '全部') {
    list = list.filter(n => (n.tags || []).includes(state.tag));
  }

  return list;
}

function renderList(list) {
  const todayStr = new Date().toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric' });
  const avg = Math.round(list.reduce((a, b) => a + b.score, 0) / list.length);

  let html = bannerHtml();
  html += `<div class="date-label">${todayStr} · 共 ${list.length} 条 · 平均 ${avg} 分</div>`;

  list.forEach((item, i) => {
    const isLast = i === list.length - 1;
    const tags = (item.tags || []).map(t => `<span class="card-tag">${escHtml(t)}</span>`).join('');
    const isHigh = item.score >= 80;

    html += `
      <div class="tl-item">
        <div class="tl-left">
          <span class="tl-time" title="${escHtml(fullTime(item.publishedAt))}">${clockOf(item.publishedAt)}</span>
          <div class="tl-dot"></div>
          ${isLast ? '' : '<div class="tl-line"></div>'}
        </div>
        <div class="tl-card" onclick="openItem('${escHtml(item.id)}')">
          <div class="card-source">${escHtml(item.source || 'AI 资讯')}</div>
          <div class="card-title">${escHtml(item.title)}</div>
          <div class="card-desc">${escHtml(item.desc || '')}</div>
          <div class="card-tags">${tags}</div>
          <div class="card-footer">
            <div class="card-score ${isHigh ? 'high' : ''}">${item.score}</div>
            <div class="card-reason">${escHtml(item.reason || '')}</div>
          </div>
        </div>
      </div>`;
  });

  document.getElementById('feed').innerHTML = html;
}

function renderSources() {
  const map = new Map();
  state.items.forEach(it => {
    const k = it.source || '未知信源';
    const cur = map.get(k) || { count: 0, sum: 0 };
    cur.count += 1;
    cur.sum += it.score;
    map.set(k, cur);
  });

  const rows = [...map.entries()].sort((a, b) => b[1].count - a[1].count || b[1].sum - a[1].sum);

  let html = `${bannerHtml()}<div class="date-label">${rows.length} 个信源 · ${state.items.length} 条资讯</div>`;
  rows.forEach(([name, v]) => {
    const avg = Math.round(v.sum / v.count);
    html += `
      <div class="tl-item">
        <div class="tl-left"><span class="tl-time">${v.count}</span><div class="tl-dot"></div></div>
        <div class="tl-card" style="cursor:default">
          <div class="card-title" style="margin-bottom:4px">${escHtml(name)}</div>
          <div class="card-footer">
            <div class="card-score ${avg >= 80 ? 'high' : ''}">${avg}</div>
            <div class="card-reason">${v.count} 条 · 均分 ${avg}</div>
          </div>
        </div>
      </div>`;
  });

  document.getElementById('feed').innerHTML = html;
}

function bannerHtml() {
  if (!state.error) return '';
  const hint = errorHint(state.error.code);
  return `
    <div class="err-banner">
      <div class="err-title">⟳ 本次刷新未完成：${escHtml(state.error.message)}</div>
      ${hint ? `<div class="err-hint">${escHtml(hint)}</div>` : ''}
      <div class="err-hint">当前展示的是最近一次成功同步的数据。</div>
    </div>`;
}

function errorBoxHtml() {
  const e = state.error;
  if (!e) {
    return `<div class="state-box"><div class="state-text">暂无资讯</div></div>`;
  }
  const hint = errorHint(e.code);
  return `
    <div class="state-box">
      <div style="font-size:26px">⚠️</div>
      <div class="state-text">${escHtml(e.message)}</div>
      ${hint ? `<div class="state-sub" style="max-width:480px;text-align:center;line-height:1.75">${escHtml(hint)}</div>` : ''}
      <div class="state-sub">错误码：${escHtml(e.code || 'UNKNOWN')}</div>
      <button class="btn" onclick="loadNews(true)" style="margin-top:4px">重试</button>
    </div>`;
}

function updateTopbar() {
  const el = document.getElementById('update-time');
  if (!state.updatedAt) {
    el.textContent = '';
    return;
  }
  const d = new Date(state.updatedAt);
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  el.textContent = `更新于 ${hh}:${mm}${state.cached ? ' · 缓存' : ''}`;
  el.title = `数据时间：${fullTime(state.updatedAt)}${state.model ? `\n生成模型：${state.model}` : ''}`;
}

function clockOf(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '—';
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function fullTime(iso) {
  if (!iso) return '时间未知';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '时间未知';
  return d.toLocaleString('zh-CN', {
    month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit',
  });
}

function escHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function openItem(id) {
  const item = state.items.find(x => x.id === id);
  if (!item) return;
  if (item.url) {
    window.open(item.url, '_blank', 'noopener');
  } else {
    alert(`该资讯暂无原文链接\n\n标题：${item.title}`);
  }
}
</script>
